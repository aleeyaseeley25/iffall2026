<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Building a Button</title>
  <script src="https://kit.fontawesome.com/049657f600.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="styles.css">

<header>
    <h1>Button Styling - Aleeya Seeley</h1>
</header>

<body>
<a href="https://www.samsung.com/us/" class="samsung-text">
    <span class="samsung">SAMSUNG</span>
</a>
<a href="https://www.lyft.com/" class="lyft-text">
    <span class="lyft">Lyft</span>
<a href="https://www.tesla.com/">

</a>
<a href="https://oldnavy.gap.com/" class="old-navy-text">
    <span class="old-navy">OLD NAVY</span>
</a>

    <span class="coca-cola">Coca-Cola</span>
</a>
